<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - TeamPulse</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .cabecalho h1 { color: #1a73e8; margin: 0; font-size: 24px; }

        .btn-sair { 
            background-color: #ea4335; 
            color: white; 
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-sair:hover { background-color: #d33828; }

        /* Grid dos 4 Cards Principais */
        .painel-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .coluna {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        h2 { 
            font-size: 16px; 
            margin-top: 0; 
            border-bottom: 2px solid #f0f2f5; 
            padding-bottom: 10px;
            color: #1a73e8;
        }
        
        input, select {
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        
        .btn-salvar { background-color: #34a853; color: white; width: 100%; margin-bottom: 10px; }
        .btn-salvar:hover { background-color: #2b8a44; }
        .btn-editar { background-color: #fbbc04; color: white; font-size: 12px; padding: 4px 8px; margin-right: 4px; }
        .btn-excluir { background-color: #ea4335; color: white; font-size: 12px; padding: 4px 8px; }

        .lista-itens {
            max-height: 250px;
            overflow-y: auto;
            font-size: 13px;
            margin-top: 5px;
        }
        
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .tag-pergunta {
            display: block;
            font-size: 11px;
            color: #1a73e8;
            font-weight: bold;
            margin-top: 2px;
        }

        /* Seção do Relatório */
        .secao-relatorio {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            align-items: end;
            margin-bottom: 20px;
        }

        .filtros-grid label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }

        .tabela-relatorio {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        .tabela-relatorio th, .tabela-relatorio td {
            border: 1px solid #e0e0e0;
            padding: 10px;
            text-align: left;
        }

        .tabela-relatorio th { background-color: #f8f9fa; color: #1a73e8; }

        /* Estilo da Modal (Caixa flutuante para Edições) */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-card h3 { margin-top: 0; color: #1a73e8; }
        .modal-acoes { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="cabecalho">
        <h1>Painel do RH (Admin) ⚙️</h1>
        <button class="btn-sair" onclick="window.location.href='index.html'">Sair</button>
    </div>

    <div class="painel-container">
        
        <!-- 1. Gestão de Usuários com Busca e Edição -->
        <div class="coluna">
            <h2>1. Gestão de Usuários</h2>
            <input type="text" id="novoNome" placeholder="Nome Completo">
            <input type="text" id="novoUsuario" placeholder="Usuário de Login">
            <input type="text" id="novoDepartamento" placeholder="Departamento (ex: TI, RH)">
            <input type="password" id="novaSenha" placeholder="Senha Inicial">
            <select id="novoPerfil">
                <option value="func">Perfil: Colaborador</option>
                <option value="admin">Perfil: Administrador</option>
            </select>
            <button class="btn-salvar" onclick="cadastrarUsuario()">Criar Usuário</button>

            <!-- Campo de Busca -->
            <input type="text" id="buscaUsuario" placeholder="🔍 Pesquisar usuário..." oninput="renderUsuarios()" style="margin-top: 10px; border-color: #1a73e8;">

            <div class="lista-itens" id="containerUsuarios"></div>
        </div>

        <!-- 2. Configurar Atividades -->
        <div class="coluna">
            <h2>2. Configurar Atividades</h2>
            <input type="text" id="novaAtividade" placeholder="Nome da Nova Atividade">
            <button class="btn-salvar" onclick="adicionarAtividade()">Adicionar Atividade</button>
            <div class="lista-itens" id="containerAtividades"></div>
        </div>

        <!-- 3. Configurar Perguntas (Até 3) -->
        <div class="coluna">
            <h2>3. Configurar Perguntas (Máx: 3)</h2>
            <input type="text" id="novaPergunta" placeholder="Digite a pergunta...">
            <button class="btn-salvar" onclick="adicionarPergunta()">Adicionar Pergunta</button>
            <div class="lista-itens" id="containerPerguntas"></div>
        </div>

        <!-- 4. Configurar Humores Vinculados à Pergunta -->
        <div class="coluna">
            <h2>4. Configurar Humores / Respostas</h2>
            <label style="font-size: 12px; font-weight: bold;">Selecione a Pergunta:</label>
            <select id="selectPerguntaParaHumor"></select>

            <div style="display: flex; gap: 5px;">
                <input type="text" id="novoEmoji" placeholder="Emoji (ex: 😀)" style="width: 35%;">
                <input type="text" id="novoTextoHumor" placeholder="Descrição (ex: Radiante)" style="width: 65%;">
            </div>
            <button class="btn-salvar" onclick="adicionarHumor()">Adicionar Opção de Humor</button>
            <div class="lista-itens" id="containerHumores"></div>
        </div>

    </div>

    <!-- Seção de Relatórios -->
    <div class="secao-relatorio">
        <h2>📊 Gerar Relatórios de Produtividade e Bem-estar</h2>
        <div class="filtros-grid">
            <div>
                <label>Data Inicial:</label>
                <input type="date" id="filtroDataInicio">
            </div>
            <div>
                <label>Data Final:</label>
                <input type="date" id="filtroDataFim">
            </div>
            <div>
                <label>Filtrar por:</label>
                <select id="tipoFiltro" onchange="atualizarOpcoesFiltro()">
                    <option value="todos">Todos os Colaboradores</option>
                    <option value="departamento">Por Departamento</option>
                    <option value="usuario">Por Colaborador Específico</option>
                </select>
            </div>
            <div id="boxFiltroDinamico" style="display: none;">
                <label id="lblFiltroDinamico">Opção:</label>
                <select id="selectFiltroDinamico"></select>
            </div>
            <div>
                <button class="btn-salvar" style="margin-bottom: 10px;" onclick="gerarRelatorio()">Gerar Relatório</button>
            </div>
        </div>

        <div id="resultadoRelatorio">
            <p style="color: #666; font-style: italic;">Selecione os filtros desejados e clique em "Gerar Relatório".</p>
        </div>
    </div>

    <!-- MODAL GENÉRICA PARA EDIÇÃO DE USUÁRIOS E HUMORES -->
    <div class="modal-bg" id="modalEdicao">
        <div class="modal-card">
            <h3 id="modalTitulo">Editar</h3>
            <div id="modalConteudo"></div>
            <div class="modal-acoes">
                <button style="background-color: #ccc;" onclick="fecharModal()">Cancelar</button>
                <button class="btn-salvar" style="width: auto; margin:0;" onclick="salvarEdicaoModal()">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script>
        let modalTipo = '';
        let modalIndex = -1;

        function carregarDados() {
            renderUsuarios();
            renderAtividades();
            renderPerguntas();
            renderHumores();
        }

        // --- USUÁRIOS ---
        function renderUsuarios() {
            const usuarios = JSON.parse(localStorage.getItem('tp_usuarios')) || [];
            const termo = document.getElementById('buscaUsuario').value.toLowerCase();
            const el = document.getElementById('containerUsuarios');
            el.innerHTML = '';

            const filtrados = usuarios.filter(u => 
                u.nome.toLowerCase().includes(termo) || 
                u.usuario.toLowerCase().includes(termo) || 
                (u.departamento && u.departamento.toLowerCase().includes(termo))
            );

            filtrados.forEach((u, i) => {
                const depto = u.departamento ? u.departamento : 'Geral';
                // Encontra o index real no array principal
                const idxReal = usuarios.findIndex(item => item.usuario === u.usuario);

                el.innerHTML += `
                    <div class="item-row">
                        <span><strong>${u.nome}</strong> (${u.usuario})<br><small>Dept: ${depto} | Perfil: ${u.perfil}</small></span>
                        <div>
                            <button class="btn-editar" onclick="abrirModalUsuario(${idxReal})">Editar</button>
                            <button class="btn-excluir" onclick="excluirUsuario(${idxReal})">X</button>
                        </div>
                    </div>
                `;
            });
        }

        function cadastrarUsuario() {
            const nome = document.getElementById('novoNome').value;
            const usuario = document.getElementById('novoUsuario').value;
            const departamento = document.getElementById('novoDepartamento').value || 'Geral';
            const senha = document.getElementById('novaSenha').value;
            const perfil = document.getElementById('novoPerfil').value;

            if(!nome || !usuario || !senha) return alert('Preencha os campos obrigatórios!');

            const usuarios = JSON.parse(localStorage.getItem('tp_usuarios')) || [];
            usuarios.push({ nome, usuario, departamento, senha, perfil });
            localStorage.setItem('tp_usuarios', JSON.stringify(usuarios));

            document.getElementById('novoNome').value = '';
            document.getElementById('novoUsuario').value = '';
            document.getElementById('novoDepartamento').value = '';
            document.getElementById('novaSenha').value = '';
            renderUsuarios();
        }

        function abrirModalUsuario(idx) {
            modalTipo = 'usuario';
            modalIndex = idx;
            const usuarios = JSON.parse(localStorage.getItem('tp_usuarios'));
            const u = usuarios[idx];

            document.getElementById('modalTitulo').innerText = 'Editar Usuário';
            document.getElementById('modalConteudo').innerHTML = `
                <label>Nome Completo:</label>
                <input type="text" id="editNome" value="${u.nome}">
                <label>Usuário de Login:</label>
                <input type="text" id="editUsuario" value="${u.usuario}">
                <label>Departamento:</label>
                <input type="text" id="editDepto" value="${u.departamento || 'Geral'}">
                <label>Senha:</label>
                <input type="text" id="editSenha" value="${u.senha}">
                <label>Perfil:</label>
                <select id="editPerfil">
                    <option value="func" ${u.perfil === 'func' ? 'selected' : ''}>Colaborador</option>
                    <option value="admin" ${u.perfil === 'admin' ? 'selected' : ''}>Administrador</option>
                </select>
            `;
            document.getElementById('modalEdicao').style.display = 'flex';
        }

        function excluirUsuario(idx) {
            if(!confirm("Tem certeza que deseja excluir este usuário?")) return;
            const usuarios = JSON.parse(localStorage.getItem('tp_usuarios'));
            usuarios.splice(idx, 1);
            localStorage.setItem('tp_usuarios', JSON.stringify(usuarios));
            renderUsuarios();
        }

        // --- ATIVIDADES ---
        function renderAtividades() {
            const atividades = JSON.parse(localStorage.getItem('tp_atividades')) || [];
            const el = document.getElementById('containerAtividades');
            el.innerHTML = '';
            atividades.forEach((atv, i) => {
                el.innerHTML += `
                    <div class="item-row">
                        <span>${atv}</span>
                        <div>
                            <button class="btn-editar" onclick="editarAtividade(${i})">Editar</button>
                            <button class="btn-excluir" onclick="removerAtividade(${i})">X</button>
                        </div>
                    </div>
                `;
            });
        }

        function adicionarAtividade() {
            const input = document.getElementById('novaAtividade');
            if(!input.value.trim()) return;
            const atividades = JSON.parse(localStorage.getItem('tp_atividades')) || [];
            atividades.push(input.value.trim());
            localStorage.setItem('tp_atividades', JSON.stringify(atividades));
            input.value = '';
            renderAtividades();
        }

        function editarAtividade(idx) {
            const atividades = JSON.parse(localStorage.getItem('tp_atividades'));
            const novoTexto = prompt("Editar Atividade:", atividades[idx]);
            if(novoTexto && novoTexto.trim()) {
                atividades[idx] = novoTexto.trim();
                localStorage.setItem('tp_atividades', JSON.stringify(atividades));
                renderAtividades();
            }
        }

        function removerAtividade(idx) {
            const atividades = JSON.parse(localStorage.getItem('tp_atividades')) || [];
            atividades.splice(idx, 1);
            localStorage.setItem('tp_atividades', JSON.stringify(atividades));
            renderAtividades();
        }

        // --- PERGUNTAS (ATÉ 3) ---
        function renderPerguntas() {
            const perguntas = JSON.parse(localStorage.getItem('tp_perguntas')) || [
                "Como você está se sentindo em relação ao seu trabalho hoje?"
            ];
            const el = document.getElementById('containerPerguntas');
            const selectH = document.getElementById('selectPerguntaParaHumor');
            
            el.innerHTML = '';
            selectH.innerHTML = '';

            perguntas.forEach((p, i) => {
                el.innerHTML += `
                    <div class="item-row">
                        <span><strong>P${i+1}:</strong> ${p}</span>
                        <div>
                            <button class="btn-editar" onclick="editarPergunta(${i})">Editar</button>
                            <button class="btn-excluir" onclick="removerPergunta(${i})">X</button>
                        </div>
                    </div>
                `;
                selectH.innerHTML += `<option value="${i}">Pergunta ${i+1}: ${p.substring(0,25)}...</option>`;
            });
        }

        function adicionarPergunta() {
            const perguntas = JSON.parse(localStorage.getItem('tp_perguntas')) || [
                "Como você está se sentindo em relação ao seu trabalho hoje?"
            ];

            if(perguntas.length >= 3) return alert('Você só pode cadastrar no máximo 3 perguntas!');

            const input = document.getElementById('novaPergunta');
            if(!input.value.trim()) return;

            perguntas.push(input.value.trim());
            localStorage.setItem('tp_perguntas', JSON.stringify(perguntas));
            input.value = '';
            renderPerguntas();
            renderHumores();
        }

        function editarPergunta(idx) {
            const perguntas = JSON.parse(localStorage.getItem('tp_perguntas'));
            const novoTexto = prompt("Editar Pergunta:", perguntas[idx]);
            if(novoTexto && novoTexto.trim()) {
                perguntas[idx] = novoTexto.trim();
                localStorage.setItem('tp_perguntas', JSON.stringify(perguntas));
                renderPerguntas();
                renderHumores();
            }
        }

        function removerPergunta(idx) {
            const perguntas = JSON.parse(localStorage.getItem('tp_perguntas')) || [];
            perguntas.splice(idx, 1);
            localStorage.setItem('tp_perguntas', JSON.stringify(perguntas));
            renderPerguntas();
            renderHumores();
        }

        // --- HUMORES (VINCULADOS A PERGUNTAS ESPECÍFICAS) ---
        function renderHumores() {
            const humores = JSON.parse(localStorage.getItem('tp_humores')) || [];
            const perguntas = JSON.parse(localStorage.getItem('tp_perguntas')) || [];
            const el = document.getElementById('containerHumores');
            el.innerHTML = '';

            humores.forEach((h, i) => {
                const perguntaTexto = perguntas[h.perguntaIndex] ? `P${h.perguntaIndex + 1}` : 'Geral';
                el.innerHTML += `
                    <div class="item-row">
                        <span>${h.emoji} ${h.texto} <span class="tag-pergunta">Vinculado a: ${perguntaTexto}</span></span>
                        <div>
                            <button class="btn-editar" onclick="abrirModalHumor(${i})">Editar</button>
                            <button class="btn-excluir" onclick="removerHumor(${i})">X</button>
                        </div>
                    </div>
                `;
            });
        }

        function adicionarHumor() {
            const emoji = document.getElementById('novoEmoji').value.trim();
            const texto = document.getElementById('novoTextoHumor').value.trim();
            const perguntaIndex = parseInt(document.getElementById('selectPerguntaParaHumor').value) || 0;

            if(!emoji || !texto) return alert('Preencha o emoji e a descrição!');

            const humores = JSON.parse(localStorage.getItem('tp_humores')) || [];
            humores.push({ emoji, texto, perguntaIndex });
            localStorage.setItem('tp_humores', JSON.stringify(humores));

            document.getElementById('novoEmoji').value = '';
            document.getElementById('novoTextoHumor').value = '';
            renderHumores();
        }

        function abrirModalHumor(idx) {
            modalTipo = 'humor';
            modalIndex = idx;
            const humores = JSON.parse(localStorage.getItem('tp_humores'));
            const perguntas = JSON.parse(localStorage.getItem('tp_perguntas')) || [];
            const h = humores[idx];

            let optionsPerguntas = '';
            perguntas.forEach((p, i) => {
                optionsPerguntas += `<option value="${i}" ${h.perguntaIndex === i ? 'selected' : ''}>P${i+1}: ${p.substring(0,30)}...</option>`;
            });

            document.getElementById('modalTitulo').innerText = 'Editar Opção de Humor';
            document.getElementById('modalConteudo').innerHTML = `
                <label>Emoji:</label>
                <input type="text" id="editEmoji" value="${h.emoji}">
                <label>Descrição:</label>
                <input type="text" id="editTextoHumor" value="${h.texto}">
                <label>Pergunta Vinculada:</label>
                <select id="editPerguntaIndex">${optionsPerguntas}</select>
            `;
            document.getElementById('modalEdicao').style.display = 'flex';
        }

        function removerHumor(idx) {
            const humores = JSON.parse(localStorage.getItem('tp_humores')) || [];
            humores.splice(idx, 1);
            localStorage.setItem('tp_humores', JSON.stringify(humores));
            renderHumores();
        }

        // --- MANIPULAÇÃO DA MODAL ---
        function fecharModal() {
            document.getElementById('modalEdicao').style.display = 'none';
        }

        function salvarEdicaoModal() {
            if (modalTipo === 'usuario') {
                const usuarios = JSON.parse(localStorage.getItem('tp_usuarios'));
                usuarios[modalIndex] = {
                    nome: document.getElementById('editNome').value,
                    usuario: document.getElementById('editUsuario').value,
                    departamento: document.getElementById('editDepto').value,
                    senha: document.getElementById('editSenha').value,
                    perfil: document.getElementById('editPerfil').value
                };
                localStorage.setItem('tp_usuarios', JSON.stringify(usuarios));
                renderUsuarios();
            } else if (modalTipo === 'humor') {
                const humores = JSON.parse(localStorage.getItem('tp_humores'));
                humores[modalIndex] = {
                    emoji: document.getElementById('editEmoji').value,
                    texto: document.getElementById('editTextoHumor').value,
                    perguntaIndex: parseInt(document.getElementById('editPerguntaIndex').value)
                };
                localStorage.setItem('tp_humores', JSON.stringify(humores));
                renderHumores();
            }
            fecharModal();
        }

        // --- FILTROS E RELATÓRIOS ---
        function atualizarOpcoesFiltro() {
            const tipo = document.getElementById('tipoFiltro').value;
            const box = document.getElementById('boxFiltroDinamico');
            const select = document.getElementById('selectFiltroDinamico');
            const lbl = document.getElementById('lblFiltroDinamico');

            select.innerHTML = '';

            if (tipo === 'todos') {
                box.style.display = 'none';
            } else if (tipo === 'departamento') {
                box.style.display = 'block';
                lbl.innerText = 'Selecione o Departamento:';
                
                const usuarios = JSON.parse(localStorage.getItem('tp_usuarios')) || [];
                const deptos = [...new Set(usuarios.map(u => u.departamento || 'Geral'))];
                deptos.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
            } else if (tipo === 'usuario') {
                box.style.display = 'block';
                lbl.innerText = 'Selecione o Colaborador:';

                const usuarios = JSON.parse(localStorage.getItem('tp_usuarios')) || [];
                usuarios.forEach(u => select.innerHTML += `<option value="${u.usuario}">${u.nome} (${u.usuario})</option>`);
            }
        }

        function gerarRelatorio() {
            let html = `
                <table class="tabela-relatorio">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Colaborador</th>
                            <th>Departamento</th>
                            <th>Tipo de Registro</th>
                            <th>Detalhe / Resposta</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}</td>
                            <td>Colaborador Teste</td>
                            <td>TI</td>
                            <td>Humor</td>
                            <td>🤩 Excelente (Pergunta 1: Como você está se sentindo...)</td>
                        </tr>
                    </tbody>
                </table>
            `;
            document.getElementById('resultadoRelatorio').innerHTML = html;
        }

        carregarDados();
    </script>
</body>
</html>
