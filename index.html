<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPulse - Acesso</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 24px;
            color: #333;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: #007bff;
            cursor: pointer;
        }
        .toggle-link:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="divLogin">
            <h2>TeamPulse - Login</h2>
            <form id="formLogin" onsubmit="realizarLogin(event)">
                <div class="input-group">
                    <label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>
                </div>
                <div class="input-group">
                    <label for="loginSenha">Senha</label>
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <p class="toggle-link" onclick="alternarTela('cadastro')">Não tem uma conta? Cadastre-se</p>
        </div>

        <!-- TELA DE CADASTRO -->
        <div id="divCadastro" class="hidden">
            <h2>Criar Conta</h2>
            <form id="formCadastro" onsubmit="cadastrarUsuarioComum(event)">
                <div class="input-group">
                    <label for="cadNome">Nome Completo</label>
                    <input type="text" id="cadNome" placeholder="Seu nome" required>
                </div>
                <div class="input-group">
                    <label for="cadEmail">E-mail</label>
                    <input type="email" id="cadEmail" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="cadSenha">Senha</label>
                    <input type="password" id="cadSenha" placeholder="Sua senha" required>
                </div>
                <button type="submit" style="background: #28a745;">Cadastrar</button>
            </form>
            <p class="toggle-link" onclick="alternarTela('login')">Já tem uma conta? Faça login</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        function alternarTela(tipo) {
            if (tipo === 'cadastro') {
                document.getElementById('divLogin').classList.add('hidden');
                document.getElementById('divCadastro').classList.remove('hidden');
            } else {
                document.getElementById('divCadastro').classList.add('hidden');
                document.getElementById('divLogin').classList.remove('hidden');
            }
        }

        async function realizarLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value.trim();

            try {
                const resposta = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    localStorage.setItem('usuarioLogado', JSON.stringify(resultado.usuario));
                    
                    // Valida pelo campo 'tipo' correto do Mongoose ('admin' ou 'colaborador')
                    if (resultado.usuario.tipo === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'colaborador.html';
                    }
                } else {
                    alert(resultado.erro || 'Credenciais inválidas.');
                }
            } catch (erro) {
                console.error(erro);
                alert('Erro de conexão com o servidor.');
            }
        }

        async function cadastrarUsuarioComum(event) {
            event.preventDefault();
            const nome = document.getElementById('cadNome').value.trim();
            const email = document.getElementById('cadEmail').value.trim();
            const senha = document.getElementById('cadSenha').value.trim();

            try {
                const resposta = await fetch(`${API_URL}/usuarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha, tipo: 'colaborador' })
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    alert('Cadastro realizado com sucesso! Faça login agora.');
                    alternarTela('login');
                } else {
                    alert('Erro ao cadastrar: ' + (resultado.erro || resultado.detalhe || 'Erro desconhecido'));
                }
            } catch (erro) {
                console.error(erro);
                alert('Erro de conexão ao tentar cadastrar.');
            }
        }
    </script>
</body>
</html>
