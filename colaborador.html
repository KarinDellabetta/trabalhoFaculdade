<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPulse - Ponto e Bem-estar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 24px;
        }

        .cabecalho h1 {
            color: #0284c7;
            font-size: 32px;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .cabecalho p {
            color: #64748b;
            font-size: 16px;
            font-weight: 500;
        }

        /* CONTAINER PRINCIPAL DILATÁVEL */
        .main-container {
            width: 100%;
            transition: all 0.3s ease;
        }

        /* LAYOUT 1: PARA 1 A 3 PERGUNTAS (CENTRALIZADO EM COLUNA) */
        .main-container.layout-centrado {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 680px;
            gap: 20px;
        }

        .perguntas-centradas {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 16px;
        }

        /* LAYOUT 2: PARA 4 PERGUNTAS (GRADE 2x2 AO LADO DO CRONÔMETRO) */
        .main-container.layout-grid {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            max-width: 1250px;
            gap: 24px;
        }

        .perguntas-grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 18px;
        }

        /* CARTÕES COM TAMANHO E ESPAÇAMENTO AMPLIADOS */
        .cartao {
            background-color: #ffffff;
            padding: 24px 28px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #e2e8f0;
            width: 100%;
        }

        .cartao h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #1e293b;
            font-weight: 700;
            line-height: 1.4;
        }

        .botoes-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .btn-humor {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .btn-humor:hover {
            background-color: #bae6fd;
            color: #075985;
        }

        /* CARTÃO DO CRONÔMETRO */
        .cartao-cronometro {
            padding: 28px;
        }

        .layout-grid .cartao-cronometro {
            width: 380px;
            flex-shrink: 0;
        }

        .layout-centrado .cartao-cronometro {
            width: 100%;
        }

        .cartao-cronometro h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            display: block;
            text-align: left;
            width: 100%;
        }

        select {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            margin-bottom: 16px;
            width: 100%;
            outline: none;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .tempo {
            font-size: 48px;
            font-weight: 800;
            color: #0f172a;
            margin: 12px 0;
            letter-spacing: 1px;
        }

        .acoes-cronometro {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn-iniciar {
            background-color: #16a34a;
            color: white;
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        .btn-iniciar:hover {
            background-color: #15803d;
        }

        .btn-finalizar {
            background-color: #dc2626;
            color: white;
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        .btn-finalizar:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="cabecalho">
        <h1>TeamPulse ⚡</h1>
        <p>Sistema de Gestão de Tempo e Bem-estar</p>
    </div>

    <!-- Container Dinâmico -->
    <div id="mainContainer" class="main-container layout-centrado">
        
        <!-- Bloco de Perguntas -->
        <div id="containerPerguntasColaborador" class="perguntas-centradas"></div>

        <!-- Painel do Cronômetro -->
        <div class="cartao cartao-cronometro">
            <h2>Controle de Atividades</h2>
            <label for="selectAtividades">Atividade Atual:</label>
            <select id="selectAtividades">
                <option>Carregando atividades...</option>
            </select>
            
            <div class="tempo" id="displayTempo">00:00:00</div>
            
            <div class="acoes-cronometro">
                <button class="btn-iniciar" onclick="iniciarCronometro()">▶ Iniciar</button>
                <button class="btn-finalizar" onclick="finalizarCronometro()">⏹ Finalizar</button>
            </div>
        </div>
    </div>

    <script>
        let tempoSegundos = 0;
        let timer = null;

        async function inicializarTela() {
            await carregarPerguntas();
            await carregarAtividades();
        }

        async function carregarPerguntas() {
            try {
                const response = await fetch('http://localhost:3000/api/perguntas');
                const perguntas = await response.json();
                
                const mainContainer = document.getElementById('mainContainer');
                const container = document.getElementById('containerPerguntasColaborador');
                container.innerHTML = '';

                // Filtra as perguntas ativas e limita ao máximo de 4
                const ativas = perguntas.filter(p => p.ativa !== false).slice(0, 4);

                // Alterna o layout com base no número de perguntas
                if (ativas.length === 4) {
                    mainContainer.className = 'main-container layout-grid';
                    container.className = 'perguntas-grid-4';
                } else {
                    mainContainer.className = 'main-container layout-centrado';
                    container.className = 'perguntas-centradas';
                }

                if (ativas.length > 0) {
                    ativas.forEach(pergunta => {
                        let botoesRespostas = pergunta.opcoes.map(opcao => `
                            <button class="btn-humor" onclick="registrarHumor('${pergunta._id}', '${opcao._id}')">
                                ${opcao.emoji ? opcao.emoji + ' ' : ''}${opcao.texto}
                            </button>
                        `).join('');

                        container.innerHTML += `
                            <div class="cartao">
                                <h2>${pergunta.titulo}</h2>
                                <div class="botoes-container">${botoesRespostas}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `
                        <div class="cartao">
                            <h2>Nenhuma pergunta configurada no momento.</h2>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erro ao buscar perguntas:', error);
            }
        }

        async function registrarHumor(perguntaId, opcaoId) {
            const userStr = localStorage.getItem('usuarioLogado');
            if (!userStr) return alert("Erro: Faça login novamente.");
            const usuario = JSON.parse(userStr);

            try {
                const response = await fetch('http://localhost:3000/api/responder-pergunta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuarioId: usuario._id,
                        perguntaId: perguntaId,
                        opcaoId: opcaoId,
                        comentario: ''
                    })
                });

                const data = await response.json();

                if (response.status === 403) {
                    alert(data.erro);
                    return;
                }

                if (!response.ok) throw new Error(data.erro);
                alert("Obrigado pelo seu feedback! Sua resposta foi registrada com sucesso.");

            } catch (error) {
                alert(error.message || "Ocorreu um erro ao enviar a resposta.");
            }
        }

        async function carregarAtividades() {
            try {
                const response = await fetch('http://localhost:3000/api/atividades');
                const atividades = await response.json();
                
                const selectA = document.getElementById('selectAtividades');
                selectA.innerHTML = '';

                atividades.forEach(ativ => {
                    selectA.innerHTML += `<option value="${ativ._id}">${ativ.descricao}</option>`;
                });
            } catch (error) {
                console.error('Erro ao buscar atividades:', error);
            }
        }

        function atualizarDisplay() {
            const hrs = String(Math.floor(tempoSegundos / 3600)).padStart(2, '0');
            const mins = String(Math.floor((tempoSegundos % 3600) / 60)).padStart(2, '0');
            const segs = String(tempoSegundos % 60).padStart(2, '0');
            document.getElementById('displayTempo').innerText = `${hrs}:${mins}:${segs}`;
        }

        async function iniciarCronometro() {
            if (timer) return;
            const userStr = localStorage.getItem('usuarioLogado');
            if (!userStr) return alert("Erro de autenticação!");
            const usuario = JSON.parse(userStr);

            const selectA = document.getElementById('selectAtividades');
            const atividadeId = selectA.value;

            try {
                const res = await fetch('http://localhost:3000/api/iniciar-atividade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuarioId: usuario._id, atividadeId })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.erro);
                    return;
                }

                timer = setInterval(() => {
                    tempoSegundos++;
                    atualizarDisplay();
                }, 1000);

            } catch (err) {
                alert("Erro ao conectar com o servidor para iniciar atividade.");
            }
        }

        async function finalizarCronometro() {
            if (!timer && tempoSegundos === 0) {
                alert("Inicie o cronômetro primeiro!");
                return;
            }

            clearInterval(timer);
            timer = null;
            
            const selectA = document.getElementById('selectAtividades');
            const atividadeId = selectA.value;
            const atividadeNome = selectA.options[selectA.selectedIndex].text;
            const tempoFinal = document.getElementById('displayTempo').innerText;

            const userStr = localStorage.getItem('usuarioLogado');
            if (userStr) {
                const usuario = JSON.parse(userStr);
                try {
                    await fetch('http://localhost:3000/api/finalizar-atividade', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            usuarioId: usuario._id,
                            atividadeId: atividadeId,
                            duracaoSegundos: tempoSegundos
                        })
                    });
                } catch (e) {
                    console.error("Erro ao finalizar atividade no banco", e);
                }
            }

            alert(`Atividade "${atividadeNome}" finalizada!\nTempo total: ${tempoFinal}`);
            tempoSegundos = 0;
            atualizarDisplay();
        }

        window.onload = inicializarTela;
    </script>
</body>
</html>
