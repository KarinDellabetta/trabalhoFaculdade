<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPulse - Ponto e Bem-estar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 15px;
        }

        .cabecalho h1 {
            color: #1a73e8;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .cartao {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            text-align: center;
        }

        .cartao h2 {
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 15px;
        }

        select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            margin-bottom: 10px;
            width: 80%;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05); 
        }

        .btn-humor {
            background-color: #e8f0fe;
            color: #1a73e8;
            display: inline-block;
            margin: 5px;
        }

        .btn-iniciar { background-color: #34a853; color: white; }
        .btn-finalizar { background-color: #ea4335; color: white; }

        .tempo {
            font-size: 42px;
            font-weight: bold;
            color: #202124;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="cabecalho">
        <h1>TeamPulse 💙</h1>
        <p>Sistema de Gestão de Tempo e Bem-estar</p>
    </div>

    <!-- Cartão do Termômetro de Humor -->
    <div class="cartao">
        <h2 id="tituloPergunta">Carregando pergunta...</h2>
        <div id="containerHumoresColaborador"></div>
    </div>

    <!-- Cartão do Cronômetro de Atividades -->
    <div class="cartao">
        <h2>Controle de Atividades</h2>
        <label>Atividade: </label>
        <select id="selectAtividades">
            <option>Carregando atividades...</option>
        </select>
        
        <div class="tempo" id="displayTempo">00:00:00</div>
        
        <button class="btn-iniciar" onclick="iniciarCronometro()">▶ Iniciar</button>
        <!-- BOTÃO DE PAUSAR FOI REMOVIDO DAQUI -->
        <button class="btn-finalizar" onclick="finalizarCronometro()">⏹ Finalizar</button>
    </div>

    <script>
        let tempoSegundos = 0;
        let timer = null;
        let perguntaAtualId = null;

        // Função que roda ao abrir a tela
        async function inicializarTela() {
            await carregarPergunta();
            await carregarAtividades();
        }

        // ==========================================
        // 1. LÓGICA DO TERMÔMETRO DE HUMOR
        // ==========================================
        
        async function carregarPergunta() {
            try {
                const response = await fetch('http://localhost:3000/api/perguntas');
                const perguntas = await response.json();
                
                const containerH = document.getElementById('containerHumoresColaborador');
                const tituloH = document.getElementById('tituloPergunta');
                containerH.innerHTML = '';

                if (perguntas.length > 0) {
                    // Pega a pergunta ativa
                    const pergunta = perguntas.find(p => p.ativa) || perguntas[0];
                    perguntaAtualId = pergunta._id;
                    tituloH.innerText = pergunta.titulo;

                    pergunta.opcoes.forEach(opcao => {
                        // Passamos o ID da opção clicada para a função registrarHumor
                        containerH.innerHTML += `<button class="btn-humor" onclick="registrarHumor('${opcao._id}')">${opcao.emoji} ${opcao.texto}</button>`;
                    });
                } else {
                    tituloH.innerText = "Nenhuma pergunta configurada no momento.";
                }
            } catch (error) {
                console.error('Erro ao buscar perguntas do banco:', error);
            }
        }

        async function registrarHumor(opcaoId) {
            // Pega o usuário logado do localStorage (criado no momento do login)
            const userStr = localStorage.getItem('usuarioLogado');
            if (!userStr) {
                alert("Erro: Usuário não autenticado. Faça login novamente.");
                return;
            }
            
            const usuario = JSON.parse(userStr);

            try {
                const response = await fetch('http://localhost:3000/api/responder-pergunta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuarioId: usuario._id, // Envia o ID do colaborador
                        perguntaId: perguntaAtualId,
                        opcaoId: opcaoId,
                        comentario: ''
                    })
                });

                const data = await response.json();

                // Trava: se o backend retornar 403, significa que ele já respondeu hoje
                if (response.status === 403) {
                    alert(data.erro); // Mostra: "Você já respondeu a esta pergunta hoje..."
                    return;
                }

                if (!response.ok) throw new Error(data.erro);

                alert("Obrigado pelo seu feedback! Sua resposta foi registrada com sucesso.");

            } catch (error) {
                console.error("Erro ao registrar humor:", error);
                alert("Ocorreu um erro ao enviar a resposta.");
            }
        }

        // ==========================================
        // 2. LÓGICA DE ATIVIDADES E CRONÔMETRO
        // ==========================================

        async function carregarAtividades() {
            try {
                const response = await fetch('http://localhost:3000/api/atividades');
                const atividades = await response.json();
                
                const selectA = document.getElementById('selectAtividades');
                selectA.innerHTML = ''; // Limpa a lista atual

                atividades.forEach(ativ => {
                    // Preenche o Select com as atividades do banco
                    selectA.innerHTML += `<option value="${ativ._id}">${ativ.descricao}</option>`;
                });
            } catch (error) {
                console.error('Erro ao buscar atividades do banco:', error);
            }
        }

        function atualizarDisplay() {
            const hrs = String(Math.floor(tempoSegundos / 3600)).padStart(2, '0');
            const mins = String(Math.floor((tempoSegundos % 3600) / 60)).padStart(2, '0');
            const segs = String(tempoSegundos % 60).padStart(2, '0');
            document.getElementById('displayTempo').innerText = `${hrs}:${mins}:${segs}`;
        }

        function iniciarCronometro() {
            if (timer) return; // Impede múltiplos cliques no "Iniciar"
            timer = setInterval(() => {
                tempoSegundos++;
                atualizarDisplay();
            }, 1000);
        }

        async function finalizarCronometro() {
            if (!timer && tempoSegundos === 0) {
                alert("Inicie o cronômetro primeiro!");
                return;
            }

            // Para o cronômetro imediatamente
            clearInterval(timer);
            timer = null;
            
            // Pega o nome da atividade selecionada
            const selectA = document.getElementById('selectAtividades');
            const atividadeId = selectA.value;
            const atividadeNome = selectA.options[selectA.selectedIndex].text;
            const tempoFinal = document.getElementById('displayTempo').innerText;

            // Alerta na tela
            alert(`Atividade "${atividadeNome}" finalizada!\nTempo total: ${tempoFinal}`);
            
            // Registra a atividade concluída no banco de dados
            const userStr = localStorage.getItem('usuarioLogado');
            if (userStr) {
                const usuario = JSON.parse(userStr);
                try {
                    await fetch('http://localhost:3000/api/registrar-atividade', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            usuarioId: usuario._id,
                            atividadeId: atividadeId
                        })
                    });
                } catch (e) {
                    console.error("Erro ao salvar log de atividade", e);
                }
            }

            // Zera o painel visualmente para uma nova atividade
            tempoSegundos = 0;
            atualizarDisplay();
        }

        // Inicia carregamentos assim que a tela abre
        window.onload = inicializarTela;
    </script>
</body>
</html>
