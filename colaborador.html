<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPulse - Ponto e Bem-estar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 15px;
        }

        .cabecalho h1 {
            color: #1a73e8;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .cartao {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            text-align: center;
        }

        .cartao h2 {
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 15px;
        }

        select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05); 
        }

        .btn-humor {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .btn-iniciar { background-color: #34a853; color: white; }
        .btn-pausar { background-color: #fbbc04; color: white; }
        .btn-finalizar { background-color: #ea4335; color: white; }

        .tempo {
            font-size: 42px;
            font-weight: bold;
            color: #202124;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="cabecalho">
        <h1>TeamPulse 💙</h1>
        <p>Sistema de Gestão de Tempo e Bem-estar</p>
    </div>

   <!-- Cartão do Termômetro de Humor -->
<div class="cartao">
    <h2>Como você está se sentindo em relação ao seu trabalho hoje?</h2>
    <div id="containerHumoresColaborador"></div>
</div>

    <!-- Cartão do Cronômetro de Atividades -->
    <div class="cartao">
        <h2>Controle de Atividades</h2>
        <label>Atividade: </label>
        <select id="selectAtividades"></select>
        
        <div class="tempo" id="displayTempo">00:00:00</div>
        
        <button class="btn-iniciar" onclick="iniciarCronometro()">▶ Iniciar</button>
        <button class="btn-pausar" onclick="pausarCronometro()">⏸ Pausar</button>
        <button class="btn-finalizar" onclick="finalizarCronometro()">⏹ Finalizar</button>
    </div>

    <script>
        let tempoSegundos = 0;
        let timer = null;

        function inicializarTela() {
            // Renderizar opções de humor configuradas pelo Admin
            const humores = JSON.parse(localStorage.getItem('tp_humores')) || [];
            const containerH = document.getElementById('containerHumoresColaborador');
            containerH.innerHTML = '';
            humores.forEach(h => {
                containerH.innerHTML += `<button class="btn-humor" onclick="registrarHumor('${h.texto}')">${h.emoji} ${h.texto}</button>`;
            });

            // Renderizar lista de atividades configuradas pelo Admin
            const atividades = JSON.parse(localStorage.getItem('tp_atividades')) || [];
            const selectA = document.getElementById('selectAtividades');
            selectA.innerHTML = '';
            atividades.forEach(a => {
                selectA.innerHTML += `<option value="${a}">${a}</option>`;
            });
        }

        function atualizarDisplay() {
            const hrs = String(Math.floor(tempoSegundos / 3600)).padStart(2, '0');
            const mins = String(Math.floor((tempoSegundos % 3600) / 60)).padStart(2, '0');
            const segs = String(tempoSegundos % 60).padStart(2, '0');
            document.getElementById('displayTempo').innerText = `${hrs}:${mins}:${segs}`;
        }

        function iniciarCronometro() {
            if (timer) return;
            timer = setInterval(() => {
                tempoSegundos++;
                atualizarDisplay();
            }, 1000);
        }

        function pausarCronometro() {
            clearInterval(timer);
            timer = null;
        }

        function finalizarCronometro() {
            pausarCronometro();
            const atv = document.getElementById('selectAtividades').value;
            alert(`Atividade "${atv}" finalizada! Tempo total: ${document.getElementById('displayTempo').innerText}`);
            tempoSegundos = 0;
            atualizarDisplay();
        }

        function registrarHumor(humor) {
            alert(`Obrigado pelo seu feedback! Humor "${humor}" registrado.`);
        }

        // Função para buscar e renderizar na tela
async function carregarAtividades() {
    try {
        const response = await fetch('http://localhost:3000/api/atividades');
        const atividades = await response.json();
        
        const listaHtml = document.getElementById('lista-atividades');
        listaHtml.innerHTML = ''; // Limpa a lista atual

        atividades.forEach(ativ => {
            listaHtml.innerHTML += `
                <li>
                    ${ativ.descricao} - Responsável: ${ativ.responsavel} 
                    (${ativ.concluida ? 'Concluída' : 'Pendente'})
                </li>
            `;
        });
    } catch (error) {
        console.error('Erro ao buscar atividades do banco:', error);
    }
}

// Chamar a função assim que a página carregar
window.onload = carregarAtividades;

        inicializarTela();
    </script>

</body>
</html>
